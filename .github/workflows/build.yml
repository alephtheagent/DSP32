name: Build & Release ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Firmware (ESP-IDF v5.5)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Package release binaries (Merged & OTA)
        run: |
          . $IDF_PATH/export.sh
          mkdir -p dist
          # 1. Generate single merged binary for offset 0x0 flashing
          python -m esptool --chip esp32s3 merge_bin \
            -o dist/merged_firmware.bin \
            --flash_mode dio --flash_size 4MB --flash_freq 80m \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xe000 build/ota_data_initial.bin \
            0x10000 build/esp32s3_usb_dac.bin

          # 2. Copy OTA binary for Web UI update (/ota.html)
          cp build/esp32s3_usb_dac.bin dist/firmware_ota.bin

          # 3. Copy individual partition files
          cp build/bootloader/bootloader.bin dist/bootloader.bin
          cp build/partition_table/partition-table.bin dist/partition-table.bin
          cp build/ota_data_initial.bin dist/ota_data_initial.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: dist/

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware binaries
        uses: actions/download-artifact@v4
        with:
          name: esp32s3-firmware
          path: dist

      - name: Attach binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/merged_firmware.bin
            dist/firmware_ota.bin
            dist/bootloader.bin
            dist/partition-table.bin
            dist/ota_data_initial.bin
          generate_release_notes: true

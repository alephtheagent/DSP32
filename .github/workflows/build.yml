name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Firmware (ESP-IDF v5.5)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Create merged binary & OTA image
        run: |
          . $IDF_PATH/export.sh
          python -m esptool --chip esp32s3 merge_bin \
            -o build/merged_firmware.bin \
            --flash_mode dio --flash_size 4MB --flash_freq 80m \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xe000 build/ota_data_initial.bin \
            0x10000 build/esp32s3_usb_dac.bin
          cp build/esp32s3_usb_dac.bin build/firmware_ota.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-dsp-firmware
          path: |
            build/merged_firmware.bin
            build/firmware_ota.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/esp32s3_usb_dac.bin
            build/esp32s3_usb_dac.elf
            build/esp32s3_usb_dac.map

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: esp32s3-dsp-firmware
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/merged_firmware.bin
            artifacts/firmware_ota.bin
            artifacts/bootloader.bin
            artifacts/partition-table.bin
            artifacts/ota_data_initial.bin
            artifacts/esp32s3_usb_dac.bin
          generate_release_notes: true
